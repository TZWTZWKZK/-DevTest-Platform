# 本地 MySQL 8（仅开发用，默认账号见下方 .env.example）
# 启动：docker compose up -d
# 停止：docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: pm-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devrootpass
      MYSQL_DATABASE: product_management
      MYSQL_USER: pmuser
      MYSQL_PASSWORD: pmapplocal
    ports:
      - "3306:3306"
    volumes:
      - pm_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevrootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pm_mysql_data:
